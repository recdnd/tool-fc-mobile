<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>fc-mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📃</text></svg>">
<style>
/* fc-mobile - PD+FC 行動端. 2026-10-02 主筆「對齊新前端規格標準(參考 band/發布欄位)」:
   rec-masters/tools/發布欄位.html と同じ語彙. 白地 / 単色 k の alpha 階 / border 0 / 影 - 動き なし.
   欄 = 超透明黒の箱 .05 -> 触れる .10 -> 複製の瞬間 .18, ラベルは系統藍. 押せる絵文字 .85 -> 1. */
:root{
  --ink:#000;
  --op:#0000ff;          /* 系統藍: 複製できた */
  --pick:#ff0000;        /* 系統紅: 危ない操作の確認 */
  --bg:#fff;
  --k:5,5,5;             /* 主題黒, 底色框だけに使う */
  --font: ui-monospace,"SF Mono",Menlo,"Courier New","Hiragino Sans","PingFang TC",monospace;
}
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); }
body{ font:13px/1.35 var(--font); height:100dvh; overflow:hidden; }
button,input,select,textarea{ border:0; border-radius:0; margin:0; padding:0; background:none; color:inherit; font:inherit; outline:none; cursor:pointer; }

/* 状態: 上に浮く小さい字(系統藍) */
.status{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 4px); left:50%; transform:translateX(-50%);
  color:var(--op); pointer-events:none; z-index:20; }

/* 全局の鍵: 右下に浮く底色框(毛玻璃, 殻の背景 alpha .50 固定) */
.fab-stack{ position:fixed; right:4px; bottom:calc(env(safe-area-inset-bottom,0px) + 4px); display:flex; flex-direction:column; gap:3px; z-index:10;
  padding:3px; background:rgba(255,255,255,.50); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.circle-btn{ width:auto; padding:1px 3px; line-height:1.4; background:rgba(var(--k),.08); opacity:.85; }
.circle-btn:hover,.circle-btn:focus-visible{ opacity:1; background:rgba(var(--k),.16); }
.circle-btn:active{ background:rgba(var(--k),.22); }
.circle-btn.armed{ opacity:1; color:var(--pick); background:rgba(var(--k),.22); }

/* 一覧 */
#list{ height:100dvh; overflow-y:auto; padding:calc(env(safe-area-inset-top,0px) + 4px) 4px calc(env(safe-area-inset-bottom,0px) + 72px); }
.group{ color:rgba(var(--k),.5); margin:6px 0 2px; }
.group:first-child{ margin-top:0; }

/* 欄: 箱全体を押すと複製. 右上の 📃 は印(押しても同じ) */
.row{ position:relative; display:block; margin:0 0 3px; padding:3px 22px 3px 3px; background:rgba(var(--k),.05); cursor:pointer; }
.row:hover{ background:rgba(var(--k),.10); }
.row:active,.row.copy-success{ background:rgba(var(--k),.18); }
.row .t{ min-width:0; }
.row .k{ display:block; color:rgba(var(--k),.5); }
.row.copy-success .k{ color:var(--op); }
.row .v{ display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.row .c{ position:absolute; top:2px; right:3px; line-height:1; opacity:.85; }
.row:hover .c{ opacity:1; }
.row.copy-success .c{ color:var(--op); opacity:1; }

/* 空: 真ん中の 📃 を押すと json を読む */
.void{ position:fixed; inset:0; z-index:1; width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  font-size:2rem; opacity:.85; user-select:none; }
.void:hover{ opacity:1; }
</style>
</head>
<body>
<div class="status" id="status"></div>
<main id="list"></main>

<div class="fab-stack">
  <button class="circle-btn" id="btn-import" title="import" aria-label="import">📥</button>
  <button class="circle-btn" id="btn-export" title="export" aria-label="export">⇩</button>
  <button class="circle-btn" id="btn-clear" title="clear" aria-label="clear">🧹</button>
</div>

<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
const KEY = "qf.items.v1";
let items = load();
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (_e) { return []; }
}
function save() { localStorage.setItem(KEY, JSON.stringify(items)); }

const statusEl = document.getElementById("status");
let statusTimer = 0;
function report(text) {
  statusEl.textContent = text;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ""; }, 3000);
}
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

document.querySelectorAll(".circle-btn").forEach((btn) => {
  btn.addEventListener("touchstart", () => buzz(30), { passive: true });
});

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";
  if (items.length === 0) {
    const e = document.createElement("button");
    e.className = "void";
    e.textContent = "📃";
    e.title = "import json";
    e.setAttribute("aria-label", "import json");
    e.addEventListener("click", () => document.getElementById("import-file").click());
    list.appendChild(e);
    return;
  }
  let g = null;
  for (const it of items) {
    if (it.group !== g) {
      g = it.group;
      const gt = document.createElement("div");
      gt.className = "group";
      gt.textContent = g;
      list.appendChild(gt);
    }
    const row = document.createElement("div");
    row.className = "row";
    const t = document.createElement("div"); t.className = "t";
    const k = document.createElement("span"); k.className = "k"; k.textContent = it.label;
    const v = document.createElement("span"); v.className = "v"; v.textContent = it.value;
    t.append(k, v);
    const c = document.createElement("span"); c.className = "c"; c.textContent = "📃";
    row.append(t, c);
    row.addEventListener("click", () => copy(it.value, row, c), { passive: true });
    list.appendChild(row);
  }
}

function copy(value, row, glyphEl) {
  const done = () => {
    buzz(20);
    row.classList.add("copy-success");
    glyphEl.textContent = "✓";
    report("copied.");
    setTimeout(() => { row.classList.remove("copy-success"); glyphEl.textContent = "📃"; }, 700);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(value).then(done, () => fallbackCopy(value, done));
  } else fallbackCopy(value, done);
}
function fallbackCopy(value, done) {
  const ta = document.createElement("textarea");
  ta.value = value; document.body.appendChild(ta);
  ta.select(); document.execCommand("copy"); ta.remove(); done();
}

/* import · 點擊即選檔上傳 json */
const fileInput = document.getElementById("import-file");
document.getElementById("btn-import").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = "";
  if (!file) return;
  let data;
  try { data = JSON.parse(await file.text()); } catch (_e) { report("parse failed."); return; }
  const group = file.name.replace(/\.json$/i, "").replace(/[_-]?seed$/i, "") || "profile";
  let n = 0;
  const put = (gr, label, value) => {
    if (typeof value !== "string" || !value.trim()) return;
    const i = items.findIndex(x => x.group === gr && x.label === label);
    if (i >= 0) items[i].value = value; else items.push({ group: gr, label, value });
    n++;
  };
  if (Array.isArray(data)) {
    for (const e of data) if (e && e.label) put(e.group || group, String(e.label), String(e.value ?? ""));
  } else if (data && typeof data === "object") {
    for (const [k, v] of Object.entries(data)) put(group, k, String(v));
  }
  save(); render();
  buzz(30);
  report(n + " recorded.");
});

document.getElementById("btn-export").addEventListener("click", () => {
  const dump = JSON.stringify(items, null, 2);
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(dump).then(() => report("exported."));
  } else fallbackCopy(dump, () => report("exported."));
});

const clearBtn = document.getElementById("btn-clear");
let armed = 0;
clearBtn.addEventListener("click", () => {
  if (!armed) {
    armed = 1;
    clearBtn.classList.add("armed");
    clearBtn.textContent = "?";
    setTimeout(() => { armed = 0; clearBtn.classList.remove("armed"); clearBtn.textContent = "🧹"; }, 3000);
    return;
  }
  items = []; save(); render();
  armed = 0; clearBtn.classList.remove("armed"); clearBtn.textContent = "🧹";
  buzz(50);
  report("cleared.");
});

render();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
